name: Public UBL Contract Reference Tests

on:
  push:
    paths:
      - 'conformance/**'
      - '.github/workflows/public-conformance.yml'
  pull_request:
    paths:
      - 'conformance/**'
      - '.github/workflows/public-conformance.yml'

permissions:
  contents: read

jobs:
  public-reference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute independent public-contract reference tests
        run: python -m unittest discover -s conformance -p 'test_*.py' -v
